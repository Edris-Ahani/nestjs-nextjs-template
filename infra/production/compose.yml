name: nestjs-foundry-production
services:
  api:
    image: ${API_IMAGE:?Set an immutable API image digest}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL_FILE: /run/secrets/database-url
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?Set the HTTPS issuer}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?Set the HTTPS JWKS endpoint}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set the API audience}
      PLATFORM_API_DOCS_ENABLED: "false"
    secrets: [database-url]
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
      interval: 15s
      timeout: 7s
      retries: 5
    stop_grace_period: 35s
    mem_limit: 768m
  web:
    image: ${WEB_IMAGE:?Set an immutable web image digest}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      BACKEND_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    mem_limit: 384m
  migrate:
    profiles: [tools]
    image: ${MIGRATION_IMAGE:?Set an immutable migration image digest}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL_FILE: /run/secrets/migration-url
    secrets: [migration-url]
secrets:
  database-url:
    file: ${DATABASE_URL_FILE:?Set the runtime URL secret-file path}
  migration-url:
    file: ${MIGRATION_URL_FILE:?Set the DDL URL secret-file path}
