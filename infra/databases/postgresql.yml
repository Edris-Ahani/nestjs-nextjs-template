services:
  database:
    image: docker.io/library/postgres:18.6-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: ${DATABASE_USERNAME:-platform}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run npm run setup}
      TZ: UTC
    ports: ["127.0.0.1:${POSTGRES_PORT:-15433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks: [data]
volumes:
  postgres-data:
