version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: [prisma, "@prisma/*"]
      next-react:
        patterns: [next, react, react-dom, eslint-config-next, "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
